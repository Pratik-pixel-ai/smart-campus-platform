server:
  port: 8080

spring:
  application:
    name: smart-campus-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartcampus}
    username: ${DATABASE_USERNAME:smartcampus}
    password: ${DATABASE_PASSWORD:smartcampus}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update          # schema is generated from the JPA entities
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # Leave empty in development: a random key is generated at start-up and a warning is logged.
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000      # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  attendance:
    # demo = simulated detection (no hardware). ble = real BLE payloads from a scanner client.
    mode: ${ATTENDANCE_MODE:demo}
    min-rssi: -85                # BLE proximity threshold used by BleAttendanceService
  seed:
    enabled: ${SEED_ENABLED:true}

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: https://api.groq.com/openai/v1/chat/completions
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  timeout-ms: 20000

logging:
  level:
    com.smartcampus: INFO
