spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/smartcampus_test}
    username: ${TEST_DATABASE_USERNAME:smartcampus}
    password: ${TEST_DATABASE_PASSWORD:smartcampus}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
