services:
  db:
    image: postgres:16-alpine
    container_name: smartcampus-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcampus}
      POSTGRES_USER: ${POSTGRES_USER:-smartcampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcampus}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartcampus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: smartcampus-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-smartcampus}
      DATABASE_USERNAME: ${POSTGRES_USER:-smartcampus}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-smartcampus}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173,http://localhost:3000}
      ATTENDANCE_MODE: ${ATTENDANCE_MODE:-demo}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: smartcampus-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
